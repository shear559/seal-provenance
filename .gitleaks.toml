# The reference package signs its conformance vectors with the well-known
# Hardhat/Anvil development accounts. Those keys are published in Hardhat's own
# documentation and are in thousands of public test suites; every project that
# ships deterministic EVM fixtures uses them, and the vectors are only
# reproducible because the keys are fixed and public.
#
# Verified before allowlisting: 0xac0974be... derives to
# 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266, the documented Anvil account #0.
#
# This allowlist names the three exact literals and nothing else, so a real key
# committed to this repository is still caught.

title = "seal-provenance"

[extend]
useDefault = true

[[allowlists]]
description = "Hardhat/Anvil published development accounts #0-#2, used by the conformance vectors"
paths = ['''^reference/''']
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
]
